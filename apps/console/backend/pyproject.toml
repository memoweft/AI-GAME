[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-game-console-backend"
version = "0.1.0"
description = "Local Windows control-plane API for AI-GAME"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[project.scripts]
ai-game-console = "ai_game_console.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_game_console*"]

[tool.setuptools.package-data]
ai_game_console = ["resources/*.md"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
addopts = "-ra"
